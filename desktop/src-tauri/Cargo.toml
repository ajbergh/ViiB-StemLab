[package]
name = "viib-stemlab-desktop"
version = "0.3.0"
description = "ViiB StemLab Desktop Shell"
authors = ["ViiB Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
fs2 = "0.4"

# Bootstrap verification hashes hundreds of MB even in development/tests.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
