name: Windows CUDA worker candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build separate CUDA worker and manifest
        shell: cmd
        run: scripts\build_cuda_worker.bat
      - uses: actions/upload-artifact@v4
        with:
          name: stemlab-windows-cuda-candidate
          path: |
            dist/cuda/windows-cuda.json
            dist/cuda/*.zip.part[0-9][0-9]
          if-no-files-found: error
      # Hosted Windows runners have no NVIDIA GPU. Validate the candidate on a
      # physical GPU before publishing the manifest and all archive parts.
