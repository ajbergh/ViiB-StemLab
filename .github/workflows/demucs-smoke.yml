name: Demucs Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-smoke:
    name: Real htdemucs_6s CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install StemLab with Demucs
        run: python -m pip install -e ".[demucs]"

      - name: Create deterministic smoke WAV
        shell: python
        run: |
          import math
          import struct
          import wave

          sample_rate = 44100
          seconds = 3
          with wave.open("smoke.wav", "wb") as writer:
              writer.setnchannels(2)
              writer.setsampwidth(2)
              writer.setframerate(sample_rate)
              for frame in range(sample_rate * seconds):
                  t = frame / sample_rate
                  value = int(
                      9000 * math.sin(2 * math.pi * 110 * t)
                      + 5000 * math.sin(2 * math.pi * 440 * t)
                  )
                  value = max(-32768, min(32767, value))
                  packed = struct.pack("<h", value)
                  writer.writeframesraw(packed + packed)

      - name: Create MP3 and OGG input variants
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i smoke.wav -codec:a libmp3lame -b:a 192k smoke.mp3
          ffmpeg -hide_banner -loglevel error -y -i smoke.wav -codec:a libvorbis -q:a 5 smoke.ogg

      - name: Report runtime
        run: viib-stemlab doctor

      - name: Generate real stem packages
        shell: bash
        run: |
          set -euo pipefail
          viib-stemlab generate smoke.wav --output smoke-output/wav --device cpu
          viib-stemlab generate smoke.mp3 --output smoke-output/mp3 --device cpu
          viib-stemlab generate smoke.ogg --output smoke-output/ogg --device cpu

      - name: Validate generated packages
        shell: bash
        run: |
          set -euo pipefail
          for format in wav mp3 ogg; do
            package="$(find "smoke-output/$format" -maxdepth 1 -type d -name '*.viibstems' -print -quit)"
            test -n "$package"
            viib-stemlab package validate "$package" --source "smoke.$format"
          done

      - name: Upload smoke packages
        uses: actions/upload-artifact@v4
        with:
          name: viib-stemlab-demucs-smoke
          path: smoke-output/**/*.viibstems
          if-no-files-found: error
