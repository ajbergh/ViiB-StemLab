name: Windows installer candidates

on:
  workflow_dispatch:
    inputs:
      separation_smoke:
        description: Download the model and verify real CPU separation in the packaged runtime
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install CPU runtime and packaging tools
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[demucs,packaging,dev]"
      - run: python -m pytest -q
      - name: Native bootstrap checks
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build Full and On-demand installers and CPU payload
        shell: cmd
        run: scripts\build_windows.bat -Installer Both
      - name: Packaged CPU separation smoke
        if: inputs.separation_smoke
        run: python packaging/smoke_backend.py desktop/src-tauri/runtime/stemlab-backend.exe --require-runtime --separate --format mp3
      - name: Native Full and HTTPS On-demand payload integration
        run: python packaging/smoke_installer_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: stemlab-windows-installer-candidates
          path: |
            dist/windows/*.exe
            dist/windows/*.sha256
            dist/components/
            desktop/src-tauri/runtime/notices/
          if-no-files-found: error
