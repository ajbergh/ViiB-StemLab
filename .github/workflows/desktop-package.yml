name: Windows standalone candidate

on:
  workflow_dispatch:
    inputs:
      separation_smoke:
        description: Download the model and verify real CPU separation in the packaged runtime
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install CPU runtime and packaging tools
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[demucs,packaging,dev]"
      - name: Fetch pinned static decoder distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $archive = Join-Path $PWD 'build/ffmpeg.zip'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') { throw 'Decoder checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/decoder
          $decoder = Get-ChildItem build/decoder -Directory | Select-Object -First 1
          Get-Content (Join-Path $decoder.FullName 'LICENSE') | Set-Content build/DECODER_NOTICES.txt
          Get-Content (Join-Path $decoder.FullName 'README.txt') | Add-Content build/DECODER_NOTICES.txt
          Add-Content build/DECODER_NOTICES.txt 'Binary and source distribution: https://www.gyan.dev/ffmpeg/builds/ ; version 8.1.2 essentials GPLv3 static build.'
          "DECODER_BIN=$($decoder.FullName)/bin" >> $env:GITHUB_ENV
      - run: python -m pytest -q
      - run: python packaging/build_backend.py --ffmpeg-dir "$env:DECODER_BIN" --ffmpeg-notices build/DECODER_NOTICES.txt
      - name: Packaged backend startup and worker smoke
        run: python packaging/smoke_backend.py desktop/src-tauri/runtime/stemlab-backend.exe --require-runtime
      - name: Packaged CPU separation smoke
        if: inputs.separation_smoke
        run: python packaging/smoke_backend.py desktop/src-tauri/runtime/stemlab-backend.exe --require-runtime --separate --format mp3
      - run: npm ci
        working-directory: desktop
      - run: npm run test
        working-directory: desktop
      - name: Dependency inventories
        shell: pwsh
        run: |
          npm --prefix desktop sbom --sbom-format cyclonedx | Set-Content desktop/src-tauri/runtime/notices/frontend-sbom.json
          cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --format-version 1 --filter-platform x86_64-pc-windows-msvc | Set-Content desktop/src-tauri/runtime/notices/rust-dependencies.json
      - name: Build installer candidate
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --bundles nsis
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: stemlab-windows-cpu-candidate
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/runtime/notices/
          if-no-files-found: error
