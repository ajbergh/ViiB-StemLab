[project]
name = "viib-stemlab"
version = "0.2.0"
description = "Local-first stem preparation for ViiB MediaHub"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "ViiB" }]
dependencies = []

[project.optional-dependencies]
audio = ["soundfile>=0.13,<1"]
demucs-modern = ["demucs>=4.0.1,<4.1", "soundfile>=0.13,<1", "torch>=2.7,<2.8", "torchaudio>=2.7,<2.8"]
packaging = ["pyinstaller>=6.12,<7", "pillow>=11,<13"]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
demucs = [
    "demucs>=4.0.1,<4.1",
    "soundfile>=0.13,<1",
    "torch>=2.6,<2.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio>=2.6,<2.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
viib-stemlab = "viib_stemlab.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viib_stemlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
conflicts = [[{extra = "demucs"}, {extra = "demucs-modern"}]]
